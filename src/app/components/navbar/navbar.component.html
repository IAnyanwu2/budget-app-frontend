<aside class="sidebar" [class.collapsed]="isCollapsed">

  <!-- Top: Brand -->
  <div class="sidebar-brand">
    <a routerLink="/" class="brand-link" aria-label="Saavy Home">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#00c65e" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="#00c65e" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="#00c65e" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name" *ngIf="!isCollapsed">Saavy</span>
    </a>

    <button class="collapse-btn" (click)="toggleCollapse()" [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline *ngIf="!isCollapsed" points="15 18 9 12 15 6"/>
        <polyline *ngIf="isCollapsed"  points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>

  <!-- Greeting pill -->
  <div class="sidebar-greeting" *ngIf="!isCollapsed">
    <span class="greeting-dot"></span>
    <span>Good {{ greeting }}, {{ firstName }}</span>
  </div>

  <!-- Nav section -->
  <nav class="sidebar-nav" aria-label="Primary navigation">
    <div class="nav-section-label" *ngIf="!isCollapsed">Menu</div>

    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
       class="nav-item" aria-label="Dashboard">
      <span class="nav-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Dashboard</span>
      <span class="nav-active-pip" *ngIf="!isCollapsed"></span>
    </a>

    <a routerLink="/reports" routerLinkActive="active"
       class="nav-item" aria-label="Reports">
      <span class="nav-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Reports</span>
      <span class="nav-active-pip" *ngIf="!isCollapsed"></span>
    </a>

    <a routerLink="/settings" routerLinkActive="active"
       class="nav-item" aria-label="Settings">
      <span class="nav-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Settings</span>
      <span class="nav-active-pip" *ngIf="!isCollapsed"></span>
    </a>

    <!-- Tools Section -->
    <div class="nav-section-label" *ngIf="!isCollapsed" style="margin-top: 1.5rem;">Tools</div>

    <button class="nav-item tool-item" (click)="setBudgetGoal($event)" aria-label="Set Budget Goal">
      <span class="nav-icon goal-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Set Budget Goal</span>
    </button>

    <!-- Budget editor inline -->
    <div class="budget-editor" *ngIf="showCategoryEditor && !isCollapsed">
      <div class="category-row" *ngFor="let it of categoryBudgets; let i = index">
        <input [(ngModel)]="it.category" [name]="'cat-' + i" placeholder="Category" />
        <input type="number" min="0" step="0.01" [(ngModel)]="it.amount" [name]="'amt-' + i" placeholder="0.00" />
        <button type="button" class="remove-btn" (click)="removeCategoryBudget(i)">✕</button>
      </div>
      <div class="editor-actions">
        <button type="button" class="add-cat-btn" (click)="addCategoryBudget()">+ Add</button>
        <button type="button" class="save-cat-btn" (click)="saveCategoryBudgets($event)">Save</button>
        <button type="button" class="close-cat-btn" (click)="showCategoryEditor = false">Close</button>
      </div>
    </div>

    <button class="nav-item tool-item" (click)="exportSummary($event)" aria-label="Export Summary">
      <span class="nav-icon export-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Export Summary</span>
    </button>

    <button class="nav-item tool-item" (click)="connectBank($event)" [disabled]="connectingBank" aria-label="Connect Bank">
      <span class="nav-icon bank-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="22" x2="21" y2="22"/>
          <line x1="6" y1="18" x2="6" y2="11"/>
          <line x1="10" y1="18" x2="10" y2="11"/>
          <line x1="14" y1="18" x2="14" y2="11"/>
          <line x1="18" y1="18" x2="18" y2="11"/>
          <polygon points="12 2 20 7 4 7"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Connect Bank</span>
      <span class="nav-badge" *ngIf="!isCollapsed">{{ connectingBank ? '…' : 'Link' }}</span>
    </button>
  </nav>

  <!-- Bottom: User + Logout -->
  <div class="sidebar-footer">
    <div class="user-section" *ngIf="!isCollapsed">
      <div class="user-avatar-wrap">
        <div class="user-avatar">{{ userInitials }}</div>
        <div class="user-status"></div>
      </div>
      <div class="user-info">
        <div class="user-name">{{ userName }}</div>
        <div class="user-role">Premium Member</div>
      </div>
    </div>
    <div class="user-avatar-wrap solo" *ngIf="isCollapsed" title="{{ userName }}">
      <div class="user-avatar">{{ userInitials }}</div>
      <div class="user-status"></div>
    </div>

    <button class="logout-btn" (click)="logout()" [attr.aria-label]="isCollapsed ? 'Logout' : ''" [title]="isCollapsed ? 'Logout' : ''">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span *ngIf="!isCollapsed">Logout</span>
    </button>
  </div>

</aside>
